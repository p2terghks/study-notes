<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430"><rect width="100%" height="100%" fill="#0e1726"/><text x="52" y="51.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">GRADUATION CHECK AI / CODE FLOW</text><text x="52" y="104.88" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="36" fill="#eef4ff">audit() 내부 · 검사와 계산 순서</text><text x="52" y="142.94" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" fill="#aebed5">각 과목을 차례로 검사합니다. 문제를 기록한 행은 continue로 건너뛰고 다음 과목을 처리합니다.</text><rect x="52" y="190" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="213.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">01</text><text x="70" y="243.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">초기화 · 과목 행 반복</text><text x="70" y="273.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">catalog_index() · totals · accepted · issues · excluded</text><text x="70" y="304.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">교육과정 인덱스와 누적 학점 준비 / 이름 없는 행은 건너뜀</text><rect x="52" y="332" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="355.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">02</text><text x="70" y="385.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">확인 여부 · 이수구분 검사</text><text x="70" y="415.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">row[&quot;확인&quot;] · CATEGORIES</text><text x="70" y="446.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">사용자 확인이 True인지, 유효한 이수구분인지 확인</text><polyline points="477.0,310 477.0,332" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477.0,332 472.21537912477646,322.0950818741206 481.78462087522354,322.0950818741206" fill="#7893b6"/><rect x="52" y="474" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="497.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">03</text><text x="70" y="527.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">학점 유효성 검사</text><text x="70" y="557.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">float() → math.isfinite()</text><text x="70" y="588.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">유한한 숫자인지 검사 / 0 초과 30 이하</text><polyline points="477.0,452 477.0,474" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477.0,474 472.21537912477646,464.0950818741206 481.78462087522354,464.0950818741206" fill="#7893b6"/><rect x="52" y="616" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="639.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">04</text><text x="70" y="669.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">성적 검사</text><text x="70" y="699.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">FAIL_GRADES → PASS_GRADES</text><text x="70" y="730.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">F·수강중 등 제외 / 모르는 성적은 검토 요청</text><polyline points="477.0,594 477.0,616" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477.0,616 472.21537912477646,606.0950818741205 481.78462087522354,606.0950818741205" fill="#7893b6"/><rect x="52" y="758" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="781.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">05</text><text x="70" y="811.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">과목명 중복 검사</text><text x="70" y="841.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">normalize(name) → key in accepted</text><text x="70" y="872.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">같은 이름의 중복은 1회 / 학점·구분 충돌은 검토 요청</text><polyline points="477.0,736 477.0,758" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477.0,758 472.21537912477646,748.0950818741205 481.78462087522354,748.0950818741205" fill="#7893b6"/><rect x="52" y="900" width="850" height="120" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="923.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">06</text><text x="70" y="953.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">유효한 과목 인정 · 영역별 누적</text><text x="70" y="983.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">accepted[key] = row · totals[category] += credits</text><text x="70" y="1014.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">모든 검사를 통과한 행만 취득학점에 반영</text><polyline points="477.0,878 477.0,900" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477.0,900 472.21537912477646,890.0950818741205 481.78462087522354,890.0950818741205" fill="#7893b6"/><rect x="1010" y="332" width="538" height="170" rx="10" fill="#19283e" stroke="#344b69"/><text x="1028" y="355.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#f3bf84">검토 기록 / issues</text><text x="1028" y="385.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">오류 · 미확인 · 충돌</text><text x="1028" y="415.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#f3bf84">issues.append(...) → continue</text><text x="1028" y="446.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">해당 행은 합산하지 않고 다음 행으로</text><text x="1028" y="472.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">최종 결과에서 입력 검토 필요를 우선 표시</text><rect x="1010" y="565" width="538" height="170" rx="10" fill="#19283e" stroke="#344b69"/><text x="1028" y="588.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#91d7b1">제외 기록 / excluded</text><text x="1028" y="618.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">F · 수강중 · 동일 중복</text><text x="1028" y="648.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#91d7b1">excluded.append(...) → continue</text><text x="1028" y="679.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">제외한 이유를 결과에 남김</text><text x="1028" y="705.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">F를 이수한 학점으로 계산하지 않음</text><polyline points="902,392 960,392 960,400 1010,400" fill="none" stroke="#f3bf84" stroke-width="2"/><polygon points="1010,400 1000.0950818741205,404.78462087522354 1000.0950818741205,395.21537912477646" fill="#f3bf84"/><polyline points="902,534 960,534 960,400 1010,400" fill="none" stroke="#f3bf84" stroke-width="2"/><polygon points="1010,400 1000.0950818741205,404.78462087522354 1000.0950818741205,395.21537912477646" fill="#f3bf84"/><polyline points="902,676 980,676 980,630 1010,630" fill="none" stroke="#91d7b1" stroke-width="2"/><polygon points="1010,630 1000.0950818741205,634.7846208752235 1000.0950818741205,625.2153791247765" fill="#91d7b1"/><polyline points="902,818 980,818 980,690 1010,690" fill="none" stroke="#91d7b1" stroke-width="2"/><polygon points="1010,690 1000.0950818741205,694.7846208752235 1000.0950818741205,685.2153791247765" fill="#91d7b1"/><text x="1010" y="799.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#82aaff">분기 요약</text><text x="1010" y="834.94" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" fill="#b9c8dd">성적이 불명확하면 issues에 기록</text><text x="1010" y="867.94" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" fill="#b9c8dd">중복 값이 충돌하면 issues에 기록</text><text x="1010" y="900.94" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" fill="#b9c8dd">제외·검토 후에도 다른 과목은 계속 처리</text><polyline points="477,1020 477,1060" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="477,1060 472.21537912477646,1050.0950818741205 481.78462087522354,1050.0950818741205" fill="#7893b6"/><rect x="52" y="1060" width="700" height="150" rx="10" fill="#19283e" stroke="#344b69"/><text x="70" y="1083.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">07 / 모든 행 처리 후</text><text x="70" y="1113.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">합산 · 조건 비교</text><text x="70" y="1143.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">총학점 → 교양·전공합계 → 최소학점 비교</text><text x="70" y="1174.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">부족학점 = max(0, 필요학점 - 인정학점)</text><text x="70" y="1200.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">전공심화 선택 검사 + 지정 의무 과목 미이수 확인</text><rect x="850" y="1060" width="698" height="150" rx="10" fill="#19283e" stroke="#344b69"/><text x="868" y="1083.62" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="14" fill="#82aaff">08 / 결과 반환</text><text x="868" y="1113.26" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" fill="#eef4ff">상태의 우선순위</text><text x="868" y="1143.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">issues → 부족학점·미이수 → 기준 충족</text><text x="868" y="1174.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">1 입력 검토 필요  /  2 입력 기준 미충족</text><text x="868" y="1200.11" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" fill="#b9c8dd">3 입력한 학점·지정 과목 기준 충족</text><polyline points="752,1135 850,1135" fill="none" stroke="#7893b6" stroke-width="2"/><polygon points="850,1135 840.0950818741205,1139.7846208752235 840.0950818741205,1130.2153791247765" fill="#7893b6"/><rect x="52" y="1260" width="1496" height="105" rx="10" fill="#142438" stroke="#344b69"/><text x="76" y="1293.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#82aaff">계산 시 주의</text><text x="76" y="1332.43" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="21" fill="#eef4ff">총학점은 전공심화를 전공선택에 포함하기 전에 계산해 중복 합산을 방지합니다.</text><text x="52" y="1403.28" font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="16" fill="#aebed5">현재 코드 기준 · 졸업시험·논문·인증·대체과목 인정 등은 별도 확인이 필요합니다.</text></svg>