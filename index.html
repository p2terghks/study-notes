<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 요약</title><style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e2a;--line:#2d3547;--text:#e7ecf4;--muted:#a4b1c4;--blue:#88ceff;--green:#7ee2b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1200px;margin:auto;padding:48px 40px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:700}h1{font-size:40px;letter-spacing:-.04em;margin:12px 0}header p{color:var(--muted);margin:8px 0 28px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}label{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0)}input{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font:inherit;flex:1;min-width:200px}button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:24px;padding:8px 15px;cursor:pointer}button.active{color:var(--green);border-color:#4d9077;background:#17372b}.filters{display:flex;flex-wrap:wrap;gap:8px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin:28px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:15px;color:var(--text);text-decoration:none;min-height:205px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:var(--blue)}.top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;background:#233344;color:var(--blue);padding:3px 9px;border-radius:6px}.format{font-size:11px;color:var(--muted)}h2{font-size:19px;margin:17px 0 12px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}.path{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin:0 0 20px}.open{color:var(--green);font-size:12px;margin-top:auto}.empty{padding:50px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:32px;padding-top:20px}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:28px 20px}.grid{grid-template-columns:1fr}h1{font-size:32px}.meta{flex-direction:column}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><main><header><div class="eyebrow">MY STUDY LIBRARY</div><h1>내 학습 요약</h1><p>필요한 개념과 코드를 한곳에서 찾아보세요.</p></header><div class="tools"><label for="search">자료 검색</label><input id="search" type="search" placeholder="제목이나 키워드로 검색 · 예: Spring, AWS, Docker"></div><div class="filters" aria-label="주제 필터"></div><div class="meta"><span id="count" aria-live="polite"></span><span>Codex로 추가한 요약</span></div><div class="grid"></div><p class="empty" hidden>일치하는 자료가 없습니다. 검색어나 주제를 바꿔 보세요.</p><footer>Codex로 추가하고 등록한 요약만 표시합니다. 휴대폰에서도 검색하고 주제별로 찾아볼 수 있습니다.</footer></main><script>
const documents = [{"path": "docs/spring-web-guide.html", "title": "Spring · JPA 입문 가이드", "category": "Spring · 백엔드", "url": "docs/spring-web-guide.html", "format": "HTML"}, {"path": "docs/react-web-guide.html", "title": "React 입문 가이드", "category": "React", "url": "docs/react-web-guide.html", "format": "HTML"}, {"path": "docs/python-syntax-guide.html", "title": "Python 문법 가이드", "category": "프로그래밍 언어", "url": "docs/python-syntax-guide.html", "format": "HTML"}, {"path": "docs/c-syntax-guide.html", "title": "C 문법 가이드", "category": "프로그래밍 언어", "url": "docs/c-syntax-guide.html", "format": "HTML"}, {"path": "docs/cpp-syntax-guide.html", "title": "C++ 문법 가이드", "category": "프로그래밍 언어", "url": "docs/cpp-syntax-guide.html", "format": "HTML"}, {"path": "docs/quick-reference/spring-reference.html", "title": "Spring 기능 · 사용법", "category": "Spring · 백엔드", "url": "docs/quick-reference/spring-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/react-reference.html", "title": "React 함수 · Hook", "category": "React", "url": "docs/quick-reference/react-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/aws-reference.html", "title": "AWS 컴퓨팅 서비스", "category": "AWS · 클라우드", "url": "docs/quick-reference/aws-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/github-reference.html", "title": "GitHub · Git · 학습 기록 작성법", "category": "GitHub · Docker", "url": "docs/quick-reference/github-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/docker-reference.html", "title": "Docker 사용법", "category": "GitHub · Docker", "url": "docs/quick-reference/docker-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/r-reference.html", "title": "R 언어 · 문법과 데이터 처리", "category": "프로그래밍 언어", "url": "docs/quick-reference/r-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/coding-test-reference.html", "title": "코딩 테스트 · 언어별 풀이", "category": "코딩 테스트", "url": "docs/quick-reference/coding-test-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/cloud-ha-reference.html", "title": "프로젝트 1 · 3-Tier 고가용성", "category": "클라우드 프로젝트", "url": "docs/quick-reference/cloud-ha-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/cloud-iac-reference.html", "title": "프로젝트 2 · Terraform 자동화", "category": "클라우드 프로젝트", "url": "docs/quick-reference/cloud-iac-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/cloud-cicd-reference.html", "title": "프로젝트 3 · Docker · ECS CI/CD", "category": "클라우드 프로젝트", "url": "docs/quick-reference/cloud-cicd-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/cloud-serverless-reference.html", "title": "프로젝트 4 · 서버리스 이미지 처리", "category": "클라우드 프로젝트", "url": "docs/quick-reference/cloud-serverless-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/computing-basics-reference.html", "title": "컴퓨팅 기본 개념 · 코어·스레드·프로세스", "category": "컴퓨터 · 네트워크 기초", "url": "docs/quick-reference/computing-basics-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/network-basics-reference.html", "title": "네트워크 기본 개념 · IP·DNS·TCP·HTTP", "category": "컴퓨터 · 네트워크 기초", "url": "docs/quick-reference/network-basics-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/aws-cli-reference.html", "title": "AWS CLI · 인증·프로파일·명령어", "category": "AWS · 클라우드", "url": "docs/quick-reference/aws-cli-reference.html", "format": "HTML"}, {"path": "docs/quick-reference/terraform-reference.html", "title": "Terraform · 문법·명령어·상태 관리", "category": "AWS · 클라우드", "url": "docs/quick-reference/terraform-reference.html", "format": "HTML"}];
const categories=['전체',...new Set(documents.map(d=>d.category))];
let selected='전체';
const filters=document.querySelector('.filters');
for(const name of categories){const b=document.createElement('button');b.textContent=name;b.className=name===selected?'active':'';b.setAttribute('aria-pressed',String(name===selected));b.onclick=()=>{selected=name;render();};filters.append(b);}
const grid=document.querySelector('.grid');
for(const d of documents){const card=document.createElement('a');card.className='card';card.href=d.url;card.dataset.search=(d.title+' '+d.path+' '+d.category).toLocaleLowerCase();card.dataset.category=d.category;
 const top=document.createElement('div');top.className='top';const badge=document.createElement('span');badge.className='badge';badge.textContent=d.category;const format=document.createElement('span');format.className='format';format.textContent=d.format;top.append(badge,format);
 const title=document.createElement('h2');title.textContent=d.title;const p=document.createElement('p');p.className='path';p.textContent='개념 · 예제 · 실습';const open=document.createElement('span');open.className='open';open.textContent='자료 열기 ↗';card.append(top,title,p,open);grid.append(card);}
function render(){const terms=document.querySelector('#search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);let count=0;for(const card of grid.children){const show=(selected==='전체'||card.dataset.category===selected)&&terms.every(t=>card.dataset.search.includes(t));card.hidden=!show;if(show)count++;}for(const b of filters.children){b.classList.toggle('active',b.textContent===selected);b.setAttribute('aria-pressed',String(b.textContent===selected));}document.querySelector('#count').textContent=count+'개 자료 / 전체 '+documents.length+'개';document.querySelector('.empty').hidden=count!==0;}
document.querySelector('#search').addEventListener('input',render);render();
</script></body></html>
