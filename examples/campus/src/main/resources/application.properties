spring.application.name=campus
spring.datasource.url=jdbc:h2:file:./data/campus;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.demo-enabled=${DEMO_ENABLED:true}

# Local H2 keeps the existing schema initialization; production uses Flyway.
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JDBC sessions are explicitly enabled only in the production profile.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# 공식 확인을 마친 졸업요건 파일. 기본값은 비어 있으며 임의 요건을 생성하지 않는다.
app.advisor.requirements-location=${ADVISOR_REQUIREMENTS_LOCATION:classpath:advising/requirements.json}

# 테이블 생성/변경은 schema.sql 또는 Flyway만 담당한다. JPA는 매핑을 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
