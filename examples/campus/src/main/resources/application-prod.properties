# 운영에서는 DB 환경변수가 필수다. 값이 빠져도 로컬 H2로 대체하지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
# 정원 경쟁으로 잠금이 오래 걸리면 무한 대기하지 않고 재시도 가능한 오류로 반환한다.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'
# schema.sql과 Flyway를 동시에 실행하지 않는다. 기존 마이그레이션은 수정하지 않고 새 버전을 추가한다.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
app.demo-enabled=false
# TLS는 ALB에서 종료하며 외부 요청의 원래 HTTPS 정보를 전달 헤더로 복원한다.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

spring.session.jdbc.initialize-schema=never
