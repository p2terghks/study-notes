apiVersion: v1
kind: Namespace
metadata:
  name: lecture-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lecture-page
  namespace: lecture-demo
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head><meta charset="utf-8"><title>Kubernetes 실습</title></head>
    <body><h1>쿠버네티스 첫 배포 성공</h1><p>ConfigMap으로 제공하는 페이지입니다.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lecture-web
  namespace: lecture-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lecture-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lecture-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: lecture-page
---
apiVersion: v1
kind: Service
metadata:
  name: lecture-web
  namespace: lecture-demo
spec:
  type: ClusterIP
  selector:
    app: lecture-web
  ports:
    - name: http
      port: 80
      targetPort: http
